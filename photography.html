<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yan2684 · 摄影集 · 星河</title>
    
    <!-- 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================
              全局重置
             ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'Quicksand', serif;
            min-height: 100vh;
            background: #0a0e1a;
            /* ===== 暗调星河背景 ===== */
            background-image: 
                /* 星星（大量小点） */
                radial-gradient(2px 2px at 15% 20%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 25% 45%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 35% 10%, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 45% 70%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 55% 30%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 65% 80%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 85% 55%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 92% 75%, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 10% 85%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 50% 5%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 70% 45%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 30% 90%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 95% 20%, rgba(255,255,255,0.5), transparent),
                /* 银河光晕 */
                radial-gradient(ellipse at 30% 40%, rgba(60, 80, 180, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(100, 60, 180, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 30%, rgba(40, 100, 200, 0.05) 0%, transparent 50%),
                /* 深空底色 */
                linear-gradient(180deg, #0a0e1a 0%, #0f1a2e 40%, #141c30 70%, #0a0e1a 100%);
            background-attachment: fixed;
            background-size: cover, cover, cover, cover, cover, cover, cover;
            color: #d0dce8;
            line-height: 1.8;
            overflow-x: hidden;
            position: relative;
        }

        /* ==========================================================
              流动光点（保留并增强）
             ========================================================== */
        .sparkle-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: rgba(255, 250, 240, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 250, 230, 0.4), 0 0 30px rgba(200, 220, 255, 0.15);
            animation: riseSparkle 14s infinite;
            bottom: -20px;
            opacity: 0;
        }

        /* 一些光点带蓝色调 */
        .sparkle.blue {
            background: rgba(180, 220, 255, 0.5);
            box-shadow: 0 0 12px rgba(150, 200, 255, 0.3), 0 0 30px rgba(100, 180, 255, 0.1);
        }

        @keyframes riseSparkle {
            0%   { transform: translateY(0) scale(0.2); opacity: 0; }
            20%  { opacity: 0.8; }
            70%  { opacity: 0.4; }
            100% { transform: translateY(-120vh) translateX(35px) scale(1.0); opacity: 0; }
        }

        /* 较慢的光点 */
        .sparkle.slow {
            animation-duration: 20s;
        }

        /* 较大的光点（像流星） */
        .sparkle.big {
            width: 8px;
            height: 8px;
            background: rgba(255, 250, 240, 0.5);
            box-shadow: 0 0 20px rgba(255, 250, 230, 0.3), 0 0 50px rgba(200, 220, 255, 0.1);
            animation-duration: 18s;
        }

        /* ==========================================================
              页面主容器
             ========================================================== */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 100px 24px 60px;
        }

        /* ==========================================================
              导航栏
             ========================================================== */
        .nav-bar {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: min(92%, 700px);
            background: rgba(10, 18, 40, 0.7);
            backdrop-filter: blur(18px);
            border-radius: 40px;
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(100, 160, 255, 0.12);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .nav-bar .logo {
            font-family: 'Noto Serif SC', serif;
            font-weight: 600;
            font-size: 1.4rem;
            color: #8ab8e8;
            background: linear-gradient(135deg, #8ab8e8, #4a8aba);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(100, 180, 255, 0.15);
        }

        .nav-bar a {
            text-decoration: none;
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(180, 210, 240, 0.6);
            padding: 6px 18px;
            border-radius: 24px;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .nav-bar a:hover {
            background: rgba(100, 180, 255, 0.08);
            color: #8ab8e8;
            border-color: rgba(100, 180, 255, 0.15);
        }

        /* ==========================================================
              音乐播放器（放在最前面）
             ========================================================== */
        .music-player {
            background: rgba(20, 40, 80, 0.40);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 20px 28px;
            border: 1px solid rgba(100, 160, 255, 0.10);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(100, 180, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 40px;
        }

        .music-player .music-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .music-player .music-info .icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 20px rgba(100, 180, 255, 0.2));
        }

        .music-player .music-info .info-text .name {
            font-family: 'Noto Serif SC', serif;
            font-weight: 500;
            font-size: 1rem;
            color: #c0d8ec;
        }

        .music-player .music-info .info-text .artist {
            font-family: 'Quicksand', sans-serif;
            font-size: 0.8rem;
            color: rgba(160, 190, 220, 0.5);
        }

        .music-player .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .music-player .controls button {
            background: rgba(60, 140, 200, 0.12);
            border: 1px solid rgba(60, 140, 200, 0.12);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(180, 210, 240, 0.7);
        }

        .music-player .controls button:hover {
            background: rgba(60, 140, 200, 0.2);
            border-color: rgba(60, 140, 200, 0.25);
            transform: scale(1.05);
            color: #8ab8e8;
        }

        .music-player .controls .volume-slider {
            width: 80px;
            accent-color: #4a8aba;
            background: transparent;
            cursor: pointer;
        }

        .music-player .controls .volume-slider::-webkit-slider-runnable-track {
            height: 4px;
            background: rgba(100, 160, 255, 0.15);
            border-radius: 2px;
        }

        .music-player .controls .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4a8aba;
            margin-top: -5px;
            box-shadow: 0 0 20px rgba(100, 180, 255, 0.2);
        }

        /* ==========================================================
              页面标题
             ========================================================== */
        .page-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 300;
            font-size: 2.8rem;
            color: #c8dcec;
            text-shadow: 0 0 40px rgba(100, 180, 255, 0.08);
            letter-spacing: 6px;
        }

        .page-header h1 span {
            color: #7ab0d8;
        }

        .page-header .subtitle {
            font-family: 'Quicksand', 'Noto Serif SC', sans-serif;
            font-weight: 300;
            font-size: 1.0rem;
            color: rgba(160, 190, 220, 0.4);
            margin-top: 4px;
            letter-spacing: 4px;
        }

        /* ==========================================================
              旁白 / 引言
             ========================================================== */
        .narration {
            background: rgba(20, 40, 80, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 28px 36px;
            margin-bottom: 40px;
            text-align: center;
            border: 1px solid rgba(100, 160, 255, 0.06);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .narration p {
            font-family: 'Noto Serif SC', serif;
            font-weight: 300;
            font-size: 1.1rem;
            color: rgba(200, 220, 240, 0.7);
            line-height: 2;
            letter-spacing: 1px;
        }

        .narration .author {
            display: block;
            margin-top: 8px;
            font-size: 0.85rem;
            color: rgba(160, 190, 220, 0.3);
            font-style: italic;
            letter-spacing: 2px;
        }

        /* ==========================================================
              照片网格
             ========================================================== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .photo-card {
            background: rgba(20, 40, 80, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(100, 160, 255, 0.06);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s ease;
        }

        .photo-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(60, 140, 200, 0.03);
            background: rgba(30, 60, 120, 0.30);
            border-color: rgba(100, 160, 255, 0.12);
        }

        .photo-card .img-wrapper {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: rgba(10, 20, 50, 0.5);
            position: relative;
        }

        .photo-card .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover .img-wrapper img {
            transform: scale(1.04);
        }

        /* 图片占位 */
        .photo-card .img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.6rem;
            color: rgba(100, 160, 200, 0.15);
            background: linear-gradient(135deg, rgba(20, 40, 80, 0.3), rgba(10, 20, 60, 0.2));
        }

        .photo-card .photo-caption {
            padding: 16px 20px 20px;
        }

        .photo-card .photo-caption .title {
            font-family: 'Noto Serif SC', serif;
            font-weight: 400;
            font-size: 1.05rem;
            color: #c8dcec;
            letter-spacing: 1px;
        }

        .photo-card .photo-caption .desc {
            font-family: 'Quicksand', 'Noto Serif SC', sans-serif;
            font-weight: 300;
            font-size: 0.85rem;
            color: rgba(160, 190, 220, 0.4);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* ==========================================================
              返回链接
             ========================================================== */
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: rgba(160, 190, 220, 0.3);
            text-decoration: none;
            border-bottom: 1px solid rgba(100, 160, 255, 0.08);
            padding-bottom: 4px;
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .back-link:hover {
            color: rgba(160, 190, 220, 0.6);
            border-bottom-color: rgba(100, 160, 255, 0.2);
        }

        /* ==========================================================
              页脚
             ========================================================== */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: rgba(160, 190, 220, 0.15);
            font-size: 0.75rem;
            font-family: 'Quicksand', sans-serif;
            border-top: 1px solid rgba(100, 160, 255, 0.04);
            letter-spacing: 2px;
        }

        /* ==========================================================
              滚动淡入
             ========================================================== */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ==========================================================
              响应式
             ========================================================== */
        @media (max-width: 600px) {
            .container { padding: 80px 16px 40px; }
            .nav-bar { padding: 10px 18px; width: 96%; }
            .nav-bar .logo { font-size: 1.2rem; }
            .page-header h1 { font-size: 2.0rem; }
            .narration { padding: 20px; }
            .narration p { font-size: 1.0rem; }
            .photo-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .music-player { flex-direction: column; align-items: stretch; text-align: center; }
            .music-player .controls { justify-content: center; }
            .music-player .controls .volume-slider { width: 60px; }
        }

        @media (max-width: 400px) {
            .photo-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <script>
        // ==========================================================
    
        const MUSIC_URL = 'CMJ - 所念皆星河.mp3';

        let audio = null;
        let isPlaying = false;

        function initAudio() {
            if (!audio) {
                audio = new Audio(MUSIC_URL);
                audio.loop = true;
                audio.volume = 0.7;
                
                const slider = document.getElementById('volumeSlider');
                slider.addEventListener('input', function() {
                    if (audio) {
                        audio.volume = this.value / 100;
                    }
                });

                audio.addEventListener('ended', function() {
                    document.getElementById('playBtn').textContent = '▶';
                    isPlaying = false;
                });
            }
        }

        function togglePlay() {
            initAudio();
            
            if (isPlaying) {
                audio.pause();
                document.getElementById('playBtn').textContent = '▶';
                isPlaying = false;
            } else {
                audio.play().catch(function(e) {
                    console.log('播放需要用户交互:', e);
                });
                document.getElementById('playBtn').textContent = '⏸';
                isPlaying = true;
            }
        }

        function volumeDown() {
            const slider = document.getElementById('volumeSlider');
            let val = parseInt(slider.value) - 10;
            if (val < 0) val = 0;
            slider.value = val;
            if (audio) audio.volume = val / 100;
        }

        function volumeUp() {
            const slider = document.getElementById('volumeSlider');
            let val = parseInt(slider.value) + 10;
            if (val > 100) val = 100;
            slider.value = val;
            if (audio) audio.volume = val / 100;
        }
        // ==========================================================
        (function() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.15,
                rootMargin: "0px 0px -30px 0px"
            });

            document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        })();
        // ==========================================================
        document.querySelectorAll('.img-wrapper img').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
                const placeholder = this.nextElementSibling;
                if (placeholder && placeholder.classList.contains('img-placeholder')) {
                    placeholder.style.display = 'flex';
                }
            });
        });

        console.log('🎵 点击播放按钮，让音乐与星河共振');
    </script>
